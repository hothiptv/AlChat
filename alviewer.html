<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="tabTitle">AlViewer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0e14;
            --panel-bg: #161b22;
            --card-bg: #1f242d;
            --border-color: #2e3440;
            --accent-color: #2563eb;
            --text-main: #e2e8f0;
            --text-sub: #94a3b8;
            --neon-blue: #00f2fe;
        }

        body, html {
            height: 100%;
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        .viewer-container {
            max-width: 950px;
            height: 100vh;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            padding: 12px;
            box-sizing: border-box;
            gap: 12px;
        }

        .viewer-header {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
            flex-shrink: 0;
        }

        .title-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(0, 242, 254, 0.25);
            padding: 6px 14px;
            border-radius: 8px;
            color: var(--neon-blue);
            font-size: 15px;
            font-weight: 700;
            max-width: 450px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            box-shadow: inset 0 0 10px rgba(0, 242, 254, 0.05);
            transition: all 0.4s ease;
        }

        .title-box.active {
            border-color: var(--neon-blue);
            box-shadow: 0 0 12px rgba(0, 242, 254, 0.3), inset 0 0 8px rgba(0, 242, 254, 0.1);
            animation: fadeInPulse 0.8s ease-in-out;
        }

        @keyframes fadeInPulse {
            0% { opacity: 0.3; transform: scale(0.97); }
            50% { opacity: 1; transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        .viewer-card {
            flex: 1;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            min-height: 0;
        }

        .viewer-body {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin: 12px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-all;
            color: #38bdf8;
            box-sizing: border-box;
        }

        .back-btn {
            background-color: rgba(37, 99, 235, 0.2);
            color: #60a5fa;
            border: 1px solid var(--accent-color);
            border-radius: 8px;
            padding: 6px 14px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            background-color: var(--accent-color);
            color: #ffffff;
        }

        @media (max-width: 768px) {
            .viewer-container { padding: 6px; }
            .title-box { max-width: 180px; }
        }
    </style>
</head>
<body oncontextmenu="return false;">

<div class="viewer-container">
    <div class="viewer-header">
        <div class="d-flex align-items-center gap-2">
            <h5 class="m-0 fw-bold text-light"><i class="bi bi-file-earmark-code"></i> AlViewer</h5>
            <div class="title-box" id="titleContainer">
                <i class="bi bi-file-text"></i>
                <span id="sourceUrlDisplay">Đang kết nối Database...</span>
            </div>
        </div>
        <a href="alchat.html" class="back-btn">
            <i class="bi bi-arrow-left"></i> Quay về AlChat
        </a>
    </div>

    <div class="viewer-card">
        <div id="loadingBox" class="text-center py-5 text-secondary my-auto">
            <div class="spinner-border spinner-border-sm me-2" role="status"></div> Đang tải dữ liệu từ Cloud...
        </div>
        <div id="errorBox" class="alert alert-danger m-3 d-none"></div>
        <pre id="contentBox" class="viewer-body d-none"></pre>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAnsLAxCi_1RiYZ7kwwzNi7subRrvTI04I",
      authDomain: "dataan-d19b7.firebaseapp.com",
      databaseURL: "https://dataan-d19b7-default-rtdb.firebaseio.com",
      projectId: "dataan-d19b7",
      storageBucket: "dataan-d19b7.firebasestorage.app",
      messagingSenderId: "634110626824",
      appId: "1:634110626824:web:903a5181db232369f495bd",
      measurementId: "G-1LK1W3FPG3"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const rawSearch = window.location.search;
    let refKey = "";
    if (rawSearch.startsWith("?")) {
        refKey = rawSearch.substring(1).trim();
    }

    const loadingBox = document.getElementById('loadingBox');
    const errorBox = document.getElementById('errorBox');
    const contentBox = document.getElementById('contentBox');
    const sourceUrlDisplay = document.getElementById('sourceUrlDisplay');
    const titleContainer = document.getElementById('titleContainer');
    const tabTitle = document.getElementById('tabTitle');

    function parseCustomTitleAndContent(rawText) {
        const lines = rawText.split('\n');
        let extractedTitle = null;
        let remainingLines = [];

        for (let i = 0; i < lines.length; i++) {
            const lineTrim = lines[i].trim();
            const titleMatch = lineTrim.match(/^title\s*=\s*["']?(.*?)["']?$/i);
            
            if (titleMatch && !extractedTitle) {
                extractedTitle = titleMatch[1];
            } else {
                remainingLines.push(lines[i]);
            }
        }

        if (extractedTitle) {
            tabTitle.innerText = `${extractedTitle} - AlViewer`;
            sourceUrlDisplay.innerText = extractedTitle;
            titleContainer.classList.add('active');
        } else {
            sourceUrlDisplay.innerText = `Tham chiếu: ?${refKey}`;
        }

        return remainingLines.join('\n').trim();
    }

    async function initViewer() {
        if (!refKey) {
            loadingBox.classList.add('d-none');
            errorBox.innerText = "Thiếu từ khóa tham chiếu trên URL (Ví dụ: alviewer?hi)";
            errorBox.classList.remove('d-none');
            sourceUrlDisplay.innerText = "Lỗi Tham Chiếu";
            return;
        }

        try {
            const docRef = doc(db, "alchat_settings", "config");
            const docSnap = await getDoc(docRef);

            if (!docSnap.exists()) {
                throw new Error("Không tìm thấy cấu hình hệ thống trên CSDL.");
            }

            const alviewerData = docSnap.data().alviewerData || {};
            const rawContent = alviewerData[refKey];

            if (!rawContent) {
                throw new Error(`Dữ liệu tham chiếu "?${refKey}" chưa được khởi tạo trong Database.`);
            }

            const cleanContent = parseCustomTitleAndContent(rawContent);

            loadingBox.classList.add('d-none');
            contentBox.innerText = cleanContent;
            contentBox.classList.remove('d-none');

        } catch (err) {
            loadingBox.classList.add('d-none');
            errorBox.innerText = err.message;
            errorBox.classList.remove('d-none');
        }
    }

    initViewer();
</script>
</body>
</html>
